secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  credentials:
    file: ../secrets/credentials.txt

services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}

    secrets:
      - db_password
      - db_root_password

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile

    container_name: wordpress
    restart: always
    depends_on:
      - mariadb

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER:     ${MYSQL_USER}
      DOMAIN_NAME:    ${DOMAIN_NAME}
      WP_ADMIN_USER:  ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER:        ${WP_USER}
      WP_USER_EMAIL:  ${WP_USER_EMAIL}

    secrets:
      - db_password
      - credentials

    volumes:
      - wordpress_files:/var/www/html

    networks:
      - inception

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdel-ha/data/mariadb

  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdel-ha/data/wordpress

networks:
  inception:
    driver: bridge