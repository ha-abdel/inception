secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: always
    env_file:
      - .env
    # environment:
    #   MYSQL_DATABASE: ${MYSQL_DATABASE}
    #   MYSQL_USER:     ${MYSQL_USER}

    secrets:
      - db_password
      - db_root_password

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile

    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    # environment:
    #   MYSQL_DATABASE: ${MYSQL_DATABASE}
    #   MYSQL_USER:     ${MYSQL_USER}
    #   DOMAIN_NAME:    ${DOMAIN_NAME}
    #   WP_ADMIN_USER:  ${WP_ADMIN_USER}
    #   WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    #   WP_USER:        ${WP_USER}
    #   WP_USER_EMAIL:  ${WP_USER_EMAIL}

    secrets:
      - db_password
      - credentials

    volumes:
      - wordpress_files:/var/www/html

    networks:
      - inception

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    # environment:
    #   DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception
  
  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: always
    networks:
      - inception
  
  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_files:/var/www/html
    secrets:
      - ftp_password
    networks:
      - inception

  website:
    build:
      context: ./requirements/bonus/website
      dockerfile: Dockerfile
    container_name: website
    restart: always
    env_file:
      - .env
    ports:
      - "8080:80"
    networks:
      - inception
  
  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: always
    env_file:
      - .env
    ports:
      - "8081:8080"
    networks:
      - inception
  
  portainer:
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    container_name: portainer
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - inception
    volumes:
      - portainer_data:/data
      - docker_socket:/run/docker.sock

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdel-ha/data/mariadb

  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdel-ha/data/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abdel-ha/data/portainer
  docker_socket:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/run/docker.sock"

networks:
  inception:
    driver: bridge