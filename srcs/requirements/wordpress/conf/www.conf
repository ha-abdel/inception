; www.conf — PHP-FPM worker pool configuration
; PHP-FPM = FastCGI Process Manager.
; It manages a pool of PHP worker processes that NGINX sends requests to.

[www]
; Run workers as www-data (the standard web server user on Debian)
user  = www-data
group = www-data

; listen: where PHP-FPM waits for connections from NGINX
; We use a TCP socket on port 9000.
; NGINX will connect to "wordpress:9000" over the docker network.
; (A unix socket /run/php/php-fpm.sock would also work but only within
; the same container — useless here since NGINX is in a different container)
listen = 0.0.0.0:9000

; Process management mode:
; dynamic = spawn workers on demand up to pm.max_children
; static  = always keep pm.max_children running (good for high traffic)
; ondemand= start workers only when a request comes in, kill when idle
pm = dynamic

; Maximum simultaneous PHP requests
pm.max_children     = 5

; How many workers to start when PHP-FPM boots
pm.start_servers    = 2

; Keep at least 1 idle worker so requests don't have to wait for spawn
pm.min_spare_servers = 1

; Kill idle workers above this threshold to save RAM
pm.max_spare_servers = 3

; Clear environment variables before passing them to workers.
; "no" means workers inherit all env vars (including our Docker secrets)
clear_env = no