# nginx.conf — NGINX reverse proxy / TLS termination config

# Number of worker processes.
# auto = one worker per CPU core — optimal for most workloads.
worker_processes auto;

# events block: connection handling settings
events {
    # Maximum simultaneous connections per worker process.
    worker_connections 1024;
}

http {
    # Include MIME type mappings (maps file extensions to Content-Type headers)
    # Without this, browsers receive all files as application/octet-stream
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # sendfile: use kernel-level file transfer (faster than read+write in userspace)
    sendfile on;

    # How long to keep an idle connection open (HTTP keep-alive)
    keepalive_timeout 65;

    # ── The main server block ─────────────────────────────────────────────────
    server {

        # Listen on port 443 for TLS connections.
        # ssl parameter tells NGINX this is an HTTPS listener.
        # This is the ONLY port reachable from outside — required by the subject.
        listen 443 ssl;
        listen [::]:443 ssl;  # also listen on IPv6

        # The domain name this server responds to.
        # Must match your login: youlogin.42.fr
        # Populated from the DOMAIN_NAME env var via docker-compose
        server_name  ${DOMAIN_NAME};

        # ── TLS certificate configuration ─────────────────────────────────────
        # Path to the self-signed certificate and private key.
        # Generated by the Dockerfile using openssl.
        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # ── TLS protocol restriction ──────────────────────────────────────────
        # The subject requires TLSv1.2 or TLSv1.3 ONLY.
        # Older protocols (TLSv1.0, TLSv1.1) are insecure and must be disabled.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Prefer server cipher suites over client's (security best practice)
        ssl_prefer_server_ciphers on;

        # ── Document root ─────────────────────────────────────────────────────
        # Where NGINX looks for files.
        # This is the same mount point as the wordpress_files volume —
        # NGINX and WordPress share this volume for serving static assets.
        root /var/www/html;

        # Default file to serve when a directory is requested
        index index.php;

        # ── Main location block ───────────────────────────────────────────────
        location / {
            # try_files: look for the requested file/directory;
            # if not found, pass the URI to index.php (WordPress front controller)
            # $uri      — look for an exact file match
            # $uri/     — look for a directory with index
            # /index.php?$args — fall back to WordPress router
            try_files $uri $uri/ /index.php?$args;
        }

        # ── PHP file handling ─────────────────────────────────────────────────
        # All .php requests are passed to PHP-FPM via FastCGI
        location ~ \.php$ {
            # Pass to PHP-FPM in the wordpress container on port 9000.
            # "wordpress" resolves via Docker's internal DNS.
            fastcgi_pass wordpress:9000;

            # The PHP script that FastCGI should execute
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Include standard FastCGI parameters (REQUEST_METHOD, QUERY_STRING, etc.)
            include fastcgi_params;
        }
    }
}