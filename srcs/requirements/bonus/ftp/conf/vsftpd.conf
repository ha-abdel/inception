# without this, vsftpd refuses to start.
listen=YES

# vsftpd can listen on IPv4 or IPv6, but not both at the same time.
listen_ipv6=NO

# anonymous_enable: allow login without credentials.
anonymous_enable=NO

# local_enable: allow system users (created in the container) to log in.
local_enable=YES

# write_enable: allow FTP commands that modify files.
write_enable=YES

local_umask=022

# chroot_local_user: jail each user inside their home directory.
chroot_local_user=YES

allow_writeable_chroot=YES

# passive mode : the client connects to the server for data transfer.
pasv_enable=YES

# pasv_min/max_port: the range of ports vsftpd can use for passive
pasv_min_port=21100
pasv_max_port=21110

# pasv_address: the IP address vsftpd tells clients to connect to.
pasv_address=${FTP_HOST}

# userlist_enable/deny: only allow users listed in /etc/vsftpd.userlist.
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

ssl_enable=NO

# Log all FTP sessions to stdout for docker logs.
xferlog_enable=YES
log_ftp_protocol=YES
# vsftpd_log_file=/dev/stdout